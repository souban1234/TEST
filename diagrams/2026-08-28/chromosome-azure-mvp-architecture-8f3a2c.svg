<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <style>
      .title{font:700 28px Arial,Helvetica,sans-serif;fill:#1f2937}.subtitle{font:600 16px Arial,Helvetica,sans-serif;fill:#374151}.text{font:13px Arial,Helvetica,sans-serif;fill:#1f2937}.small{font:12px Arial,Helvetica,sans-serif;fill:#374151}.box{rx:16;ry:16;stroke-width:2}.edge{fill:none;stroke:#37474f;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.container{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:20;ry:20}.app{fill:#e8f5e9;stroke:#2e7d32}.client{fill:#e3f2fd;stroke:#1565c0}.data{fill:#fff3e0;stroke:#ef6c00}.ai{fill:#f3e5f5;stroke:#7b1fa2}.monitor{fill:#fce4ec;stroke:#ad1457}.security{fill:#ede7f6;stroke:#4527a0}.label{font:12px Arial,Helvetica,sans-serif;fill:#111827}.pill{fill:white;stroke:#cbd5e1;stroke-width:1;rx:10;ry:10}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#ffffff"/>
  <text x="800" y="45" text-anchor="middle" class="title">Chromosome Homologation Application - Azure MVP Architecture</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle">API-based Compliance Validation Platform with RAG, Azure OpenAI, Cosmos DB Monitoring, and Cost-Optimized MVP Services</text>

  <rect x="30" y="110" width="1540" height="850" class="container"/>
  <text x="800" y="140" text-anchor="middle" class="subtitle">Azure Region: East US</text>

  <rect x="60" y="430" width="230" height="120" class="box client"/>
  <text x="175" y="462" text-anchor="middle" class="subtitle">Client Applications</text>
  <text x="175" y="488" text-anchor="middle" class="text">Web UI</text>
  <text x="175" y="510" text-anchor="middle" class="text">Mobile Apps</text>
  <text x="175" y="532" text-anchor="middle" class="text">External API Consumers</text>

  <rect x="380" y="205" width="470" height="550" rx="18" ry="18" fill="#f1f8e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="615" y="235" text-anchor="middle" class="subtitle">Azure App Service B1</text>
  <text x="615" y="258" text-anchor="middle" class="small">FastAPI Docker Container • 1 vCPU • 1.75 GB RAM</text>

  <rect x="430" y="295" width="370" height="70" class="box app"/>
  <text x="615" y="322" text-anchor="middle" class="subtitle">REST API Endpoints</text>
  <text x="615" y="345" text-anchor="middle" class="small">homologation/chat • code-generation • regression • common</text>

  <rect x="430" y="395" width="370" height="70" class="box app"/>
  <text x="615" y="423" text-anchor="middle" class="subtitle">Authentication Middleware</text>
  <text x="615" y="446" text-anchor="middle" class="small">JWT validation • user authorization</text>

  <rect x="430" y="495" width="370" height="85" class="box app"/>
  <text x="615" y="523" text-anchor="middle" class="subtitle">Controller Layer</text>
  <text x="615" y="546" text-anchor="middle" class="small">Homologation • Code Generation • Regression</text>
  <text x="615" y="566" text-anchor="middle" class="small">Common utilities</text>

  <rect x="430" y="615" width="370" height="90" class="box app"/>
  <text x="615" y="642" text-anchor="middle" class="subtitle">Helper / Service Layer</text>
  <text x="615" y="665" text-anchor="middle" class="small">DB operations • RAG orchestration</text>
  <text x="615" y="685" text-anchor="middle" class="small">Prompt construction • validation logic</text>

  <rect x="465" y="790" width="300" height="72" class="box app"/>
  <text x="615" y="820" text-anchor="middle" class="subtitle">In-Memory Context Cache</text>
  <text x="615" y="843" text-anchor="middle" class="small">Recent sessions and message context</text>

  <rect x="970" y="175" width="250" height="105" class="box security"/>
  <text x="1095" y="205" text-anchor="middle" class="subtitle">Azure Key Vault</text>
  <text x="1095" y="229" text-anchor="middle" class="small">OpenAI key • DB password</text>
  <text x="1095" y="249" text-anchor="middle" class="small">JWT secret</text>
  <text x="1095" y="269" text-anchor="middle" class="small">Managed Identity access</text>

  <path d="M 980 395 C 950 360, 910 325, 850 320" class="dash"/>
  <text x="918" y="346" text-anchor="middle" class="label">runtime secrets</text>

  <rect x="960" y="330" width="250" height="115" class="box data"/>
  <text x="1085" y="360" text-anchor="middle" class="subtitle">Azure PostgreSQL</text>
  <text x="1085" y="384" text-anchor="middle" class="small">Users • chat sessions</text>
  <text x="1085" y="404" text-anchor="middle" class="small">Messages • tokens used</text>
  <text x="1085" y="424" text-anchor="middle" class="small">Audit records</text>

  <rect x="1265" y="330" width="250" height="115" class="box data"/>
  <text x="1390" y="360" text-anchor="middle" class="subtitle">Azure AI Search</text>
  <text x="1390" y="384" text-anchor="middle" class="small">Vector store</text>
  <text x="1390" y="404" text-anchor="middle" class="small">Compliance document index</text>
  <text x="1390" y="424" text-anchor="middle" class="small">Top-K semantic retrieval</text>

  <rect x="1265" y="535" width="250" height="135" class="box data"/>
  <text x="1390" y="565" text-anchor="middle" class="subtitle">Azure Blob Storage</text>
  <text x="1390" y="589" text-anchor="middle" class="small">Compliance PDFs • uploads</text>
  <text x="1390" y="609" text-anchor="middle" class="small">Generated code artifacts</text>
  <text x="1390" y="629" text-anchor="middle" class="small">Embeddings cache</text>
  <text x="1390" y="649" text-anchor="middle" class="small">Archived monitoring logs</text>

  <rect x="960" y="535" width="250" height="135" class="box ai"/>
  <text x="1085" y="565" text-anchor="middle" class="subtitle">Azure OpenAI</text>
  <text x="1085" y="589" text-anchor="middle" class="small">gpt-3.5-turbo</text>
  <text x="1085" y="609" text-anchor="middle" class="small">text-embedding-3-small</text>
  <text x="1085" y="629" text-anchor="middle" class="small">LLM inference</text>
  <text x="1085" y="649" text-anchor="middle" class="small">Embedding generation</text>

  <rect x="960" y="745" width="250" height="120" class="box monitor"/>
  <text x="1085" y="775" text-anchor="middle" class="subtitle">Azure Cosmos DB</text>
  <text x="1085" y="799" text-anchor="middle" class="small">Real-time monitoring</text>
  <text x="1085" y="819" text-anchor="middle" class="small">api-metrics • llm-usage</text>
  <text x="1085" y="839" text-anchor="middle" class="small">system-events • alerts</text>

  <rect x="1265" y="745" width="250" height="120" class="box monitor"/>
  <text x="1390" y="775" text-anchor="middle" class="subtitle">Application Insights</text>
  <text x="1390" y="799" text-anchor="middle" class="small">Aggregated logs/traces</text>
  <text x="1390" y="819" text-anchor="middle" class="small">P50/P95/P99 latency</text>
  <text x="1390" y="839" text-anchor="middle" class="small">Error rate and cost alerts</text>

  <path d="M 290 490 L 430 330" class="edge"/>
  <text x="348" y="395" text-anchor="middle" class="label">HTTPS REST API</text>

  <path d="M 615 365 L 615 395" class="edge"/>
  <path d="M 615 465 L 615 495" class="edge"/>
  <path d="M 615 580 L 615 615" class="edge"/>
  <path d="M 615 705 L 615 790" class="edge"/>
  <path d="M 465 826 L 395 826 L 395 660 L 430 660" class="edge"/>

  <path d="M 800 645 C 875 595, 905 440, 960 390" class="edge"/>
  <text x="895" y="510" text-anchor="middle" class="label">read/write session data</text>

  <path d="M 800 660 C 895 660, 890 604, 960 604" class="edge"/>
  <text x="895" y="636" text-anchor="middle" class="label">embeddings + LLM prompts</text>

  <path d="M 1210 595 L 1265 385" class="edge"/>
  <text x="1260" y="496" text-anchor="middle" class="label">vector query</text>

  <path d="M 1390 445 L 1390 535" class="edge"/>
  <text x="1465" y="493" text-anchor="middle" class="label">chunk refs</text>

  <path d="M 1265 602 C 1205 612, 1160 635, 1210 645" class="edge"/>
  <text x="1228" y="636" text-anchor="middle" class="label">document chunks</text>

  <path d="M 960 820 C 880 820, 842 700, 800 680" class="dash"/>
  <text x="875" y="762" text-anchor="middle" class="label">async metrics/events</text>

  <path d="M 850 715 C 1035 930, 1270 900, 1390 865" class="dash"/>
  <text x="1125" y="925" text-anchor="middle" class="label">telemetry, traces, alerts</text>

  <path d="M 430 690 C 330 720, 270 625, 205 550" class="edge"/>
  <text x="305" y="675" text-anchor="middle" class="label">JSON response + metadata</text>

  <rect x="80" y="900" width="1420" height="40" class="pill"/>
  <text x="790" y="925" text-anchor="middle" class="small">Primary request path: Client → FastAPI Auth/Controllers → PostgreSQL context → RAG via Azure OpenAI + AI Search + Blob Storage → Azure OpenAI response → PostgreSQL save → Client response. Monitoring flows asynchronously to Cosmos DB and Application Insights.</text>
</svg>