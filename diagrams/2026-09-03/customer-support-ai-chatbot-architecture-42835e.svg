<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Customer Support AI Chatbot System Architecture</title>
  <desc id="desc">System architecture showing user queries flowing through chat UI, API gateway, chatbot backend, knowledge retrieval, knowledge base, LLM, guardrails, and response back to the user.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474f"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#757575"/>
    </marker>
    <style>
      .title{font:700 28px Arial,Helvetica,sans-serif;fill:#263238}.groupTitle{font:700 18px Arial,Helvetica,sans-serif;fill:#37474f}.label{font:600 15px Arial,Helvetica,sans-serif;fill:#263238}.small{font:12px Arial,Helvetica,sans-serif;fill:#455a64}.edgeLabel{font:12px Arial,Helvetica,sans-serif;fill:#37474f}.box{rx:14;ry:14;stroke-width:2}.actor{fill:#e1f5fe;stroke:#0288d1}.app{fill:#e8f5e9;stroke:#43a047}.data{fill:#fff3e0;stroke:#fb8c00}.ai{fill:#f3e5f5;stroke:#8e24aa}.obs{fill:#f5f5f5;stroke:#757575;stroke-dasharray:8 6}.group{fill:#fafafa;stroke:#b0bec5;stroke-width:2;rx:18;ry:18}.flow{fill:none;stroke:#37474f;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#757575;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrowDashed)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Customer Support AI Chatbot System Architecture</text>

  <rect x="260" y="100" width="220" height="160" class="group"/>
  <text x="370" y="130" text-anchor="middle" class="groupTitle">User Channels</text>

  <rect x="540" y="90" width="520" height="690" class="group"/>
  <text x="800" y="120" text-anchor="middle" class="groupTitle">Chatbot Backend</text>

  <rect x="1120" y="120" width="360" height="360" class="group"/>
  <text x="1300" y="150" text-anchor="middle" class="groupTitle">Knowledge Layer</text>

  <rect x="1120" y="560" width="250" height="140" class="group"/>
  <text x="1245" y="590" text-anchor="middle" class="groupTitle">AI Layer</text>

  <rect x="60" y="150" width="150" height="72" class="box actor"/>
  <text x="135" y="180" text-anchor="middle" class="label">Customer /</text>
  <text x="135" y="200" text-anchor="middle" class="label">End User</text>

  <rect x="295" y="160" width="150" height="72" class="box app"/>
  <text x="370" y="190" text-anchor="middle" class="label">Web / Mobile</text>
  <text x="370" y="210" text-anchor="middle" class="label">Chat UI</text>

  <rect x="600" y="155" width="155" height="72" class="box app"/>
  <text x="677" y="185" text-anchor="middle" class="label">Chat API</text>
  <text x="677" y="205" text-anchor="middle" class="label">Gateway</text>

  <rect x="815" y="155" width="175" height="72" class="box app"/>
  <text x="902" y="185" text-anchor="middle" class="label">Conversation</text>
  <text x="902" y="205" text-anchor="middle" class="label">Orchestrator</text>

  <rect x="620" y="310" width="165" height="72" class="box app"/>
  <text x="702" y="340" text-anchor="middle" class="label">Session &amp;</text>
  <text x="702" y="360" text-anchor="middle" class="label">Context</text>

  <rect x="815" y="310" width="175" height="72" class="box app"/>
  <text x="902" y="340" text-anchor="middle" class="label">Knowledge</text>
  <text x="902" y="360" text-anchor="middle" class="label">Retrieval Service</text>

  <rect x="815" y="470" width="175" height="72" class="box app"/>
  <text x="902" y="500" text-anchor="middle" class="label">Prompt Builder</text>
  <text x="902" y="520" text-anchor="middle" class="small">query + context + passages</text>

  <rect x="815" y="625" width="175" height="72" class="box app"/>
  <text x="902" y="655" text-anchor="middle" class="label">Safety &amp; Policy</text>
  <text x="902" y="675" text-anchor="middle" class="label">Guardrails</text>

  <rect x="1180" y="190" width="150" height="72" class="box data"/>
  <text x="1255" y="220" text-anchor="middle" class="label">Support Articles,</text>
  <text x="1255" y="240" text-anchor="middle" class="label">FAQs, Docs</text>

  <path d="M1210 330 C1210 312 1350 312 1350 330 L1350 395 C1350 413 1210 413 1210 395 Z" class="data" stroke-width="2"/>
  <ellipse cx="1280" cy="330" rx="70" ry="18" fill="#fff8e1" stroke="#fb8c00" stroke-width="2"/>
  <text x="1280" y="362" text-anchor="middle" class="label">Knowledge</text>
  <text x="1280" y="382" text-anchor="middle" class="label">Base</text>

  <path d="M1210 430 C1210 412 1350 412 1350 430 L1350 455 C1350 473 1210 473 1210 455 Z" class="data" stroke-width="2"/>
  <ellipse cx="1280" cy="430" rx="70" ry="18" fill="#fff8e1" stroke="#fb8c00" stroke-width="2"/>
  <text x="1280" y="452" text-anchor="middle" class="label">Vector Index</text>

  <rect x="1170" y="610" width="150" height="72" class="box ai"/>
  <text x="1245" y="640" text-anchor="middle" class="label">Large Language</text>
  <text x="1245" y="660" text-anchor="middle" class="label">Model</text>

  <path d="M622 815 C622 797 780 797 780 815 L780 855 C780 873 622 873 622 855 Z" class="obs" stroke-width="2"/>
  <ellipse cx="701" cy="815" rx="79" ry="18" fill="#eeeeee" stroke="#757575" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="701" y="842" text-anchor="middle" class="label">Logs &amp; Analytics</text>

  <path d="M210 186 L295 196" class="flow"/><text x="235" y="170" class="edgeLabel">asks question</text>
  <path d="M445 196 L600 191" class="flow"/><text x="505" y="178" class="edgeLabel">query</text>
  <path d="M755 191 L815 191" class="flow"/>
  <path d="M902 227 L902 310" class="flow"/><text x="915" y="272" class="edgeLabel">search request</text>
  <path d="M815 346 L785 346" class="flow"/><text x="720" y="300" class="edgeLabel">state</text>
  <path d="M990 346 L1210 445" class="flow"/><text x="1035" y="365" class="edgeLabel">semantic / keyword search</text>
  <path d="M1280 430 L1280 412" class="flow"/><text x="1290" y="424" class="edgeLabel">retrieve chunks</text>
  <path d="M1255 262 L1280 312" class="flow"/><text x="1305" y="290" class="edgeLabel">ingest / index</text>
  <path d="M1210 365 L990 506" class="flow"/><text x="1040" y="458" class="edgeLabel">relevant passages</text>
  <path d="M702 382 L815 506" class="flow"/><text x="700" y="455" class="edgeLabel">history</text>
  <path d="M990 506 L1170 646" class="flow"/><text x="1038" y="585" class="edgeLabel">grounded prompt</text>
  <path d="M1170 646 L990 661" class="flow"/><text x="1030" y="637" class="edgeLabel">draft answer</text>
  <path d="M815 661 L700 650 L700 227 L815 191" class="flow"/><text x="625" y="630" class="edgeLabel">approved response</text>
  <path d="M815 177 L755 177" class="flow"/><path d="M600 177 L445 177" class="flow"/><path d="M295 177 L210 177" class="flow"/>
  <text x="485" y="150" class="edgeLabel">answer</text>
  <text x="230" y="150" class="edgeLabel">response</text>
  <path d="M850 697 L750 815" class="dash"/><text x="785" y="775" class="edgeLabel">moderation logs</text>
  <path d="M865 227 L720 815" class="dash"/><text x="735" y="745" class="edgeLabel">events, feedback</text>

  <rect x="60" y="785" width="470" height="78" fill="#ffffff" stroke="#cfd8dc" rx="12"/>
  <text x="80" y="812" class="label">Legend</text>
  <rect x="80" y="826" width="24" height="16" class="actor"/><text x="114" y="839" class="small">User</text>
  <rect x="170" y="826" width="24" height="16" class="app"/><text x="204" y="839" class="small">Application services</text>
  <rect x="330" y="826" width="24" height="16" class="data"/><text x="364" y="839" class="small">Data / knowledge stores</text>
  <line x1="80" y1="855" x2="115" y2="855" class="dash"/><text x="125" y="859" class="small">Observability / analytics events</text>
</svg>