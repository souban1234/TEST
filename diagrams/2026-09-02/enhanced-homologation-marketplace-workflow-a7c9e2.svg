<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2100" viewBox="0 0 1400 2100" role="img" aria-label="Enhanced Homologation Application publishing workflow using Azure AI Foundry and Chromosome Marketplace">
  <defs>
    <style>
      .title{font:700 30px Arial, sans-serif;fill:#12324a}.subtitle{font:16px Arial,sans-serif;fill:#455a64}.step{font:700 18px Arial,sans-serif;fill:white}.boxTitle{font:700 17px Arial,sans-serif;fill:#102a43}.boxText{font:14px Arial,sans-serif;fill:#263238}.small{font:12px Arial,sans-serif;fill:#455a64}.lane{font:700 16px Arial,sans-serif;fill:#37474f}.arrow{stroke:#607d8b;stroke-width:3;fill:none;marker-end:url(#arrow)}.feedback{stroke:#ef6c00;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#arrowOrange)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#607d8b"/></marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#ef6c00"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1400" height="2100" fill="#f7fbff"/>
  <text x="700" y="52" text-anchor="middle" class="title">Enhanced Homologation Application Publishing Workflow</text>
  <text x="700" y="82" text-anchor="middle" class="subtitle">Develop in Azure AI Foundry → Productionize with Azure services → Publish in Chromosome Marketplace / Agent Store</text>

  <g transform="translate(60 115)">
    <rect x="0" y="0" width="1280" height="140" rx="18" fill="#ffffff" stroke="#bbdefb" filter="url(#shadow)"/>
    <text x="30" y="34" class="boxTitle">Azure service foundation</text>
    <g transform="translate(40 58)"><rect width="190" height="54" rx="12" fill="#e3f2fd" stroke="#1565c0"/><text x="95" y="24" text-anchor="middle" class="boxText">Azure AI Foundry</text><text x="95" y="42" text-anchor="middle" class="small">Agent design &amp; SDK</text></g>
    <g transform="translate(260 58)"><rect width="190" height="54" rx="12" fill="#e8f5e9" stroke="#2e7d32"/><text x="95" y="24" text-anchor="middle" class="boxText">Blob Storage</text><text x="95" y="42" text-anchor="middle" class="small">Docs, uploads, artifacts</text></g>
    <g transform="translate(480 58)"><rect width="190" height="54" rx="12" fill="#fff8e1" stroke="#f9a825"/><text x="95" y="24" text-anchor="middle" class="boxText">Azure AI Search</text><text x="95" y="42" text-anchor="middle" class="small">Vector index &amp; RAG</text></g>
    <g transform="translate(700 58)"><rect width="190" height="54" rx="12" fill="#ede7f6" stroke="#673ab7"/><text x="95" y="24" text-anchor="middle" class="boxText">Azure RDS / DB</text><text x="95" y="42" text-anchor="middle" class="small">Users, sessions, audit</text></g>
    <g transform="translate(920 58)"><rect width="190" height="54" rx="12" fill="#fce4ec" stroke="#c2185b"/><text x="95" y="24" text-anchor="middle" class="boxText">Cosmos DB</text><text x="95" y="42" text-anchor="middle" class="small">Metrics &amp; events</text></g>
    <g transform="translate(1140 58)"><rect width="110" height="54" rx="12" fill="#e0f2f1" stroke="#00796b"/><text x="55" y="24" text-anchor="middle" class="boxText">App Service</text><text x="55" y="42" text-anchor="middle" class="small">Containers</text></g>
  </g>

  <!-- columns/lane labels -->
  <g transform="translate(55 295)">
    <rect x="0" y="0" width="245" height="1740" rx="12" fill="#eef7ff" stroke="#bbdefb"/>
    <rect x="265" y="0" width="245" height="1740" rx="12" fill="#f8f5ff" stroke="#d1c4e9"/>
    <rect x="530" y="0" width="245" height="1740" rx="12" fill="#fff8ef" stroke="#ffe0b2"/>
    <rect x="795" y="0" width="245" height="1740" rx="12" fill="#f1fff4" stroke="#c8e6c9"/>
    <rect x="1060" y="0" width="245" height="1740" rx="12" fill="#fff2f7" stroke="#f8bbd0"/>
    <text x="122" y="28" text-anchor="middle" class="lane">Application Owner / Developer</text>
    <text x="388" y="28" text-anchor="middle" class="lane">Manager / Admin</text>
    <text x="652" y="28" text-anchor="middle" class="lane">Chromosome Build / Kernel Team</text>
    <text x="918" y="28" text-anchor="middle" class="lane">Frontend &amp; DevOps Team</text>
    <text x="1183" y="28" text-anchor="middle" class="lane">Chromosome Admin / Marketplace</text>
  </g>

  <!-- step helper: x positions 90,355,620,885,1150 y start 370 increments -->
  <g filter="url(#shadow)">
    <g transform="translate(90 360)"><circle cx="22" cy="36" r="22" fill="#1976d2"/><text x="22" y="42" text-anchor="middle" class="step">1</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#1976d2"/><text x="145" y="24" text-anchor="middle" class="boxTitle">Create Agent</text><text x="145" y="45" text-anchor="middle" class="boxText">Build Homologation Agent</text><text x="145" y="62" text-anchor="middle" class="small">in Azure AI Foundry</text></g>
    <g transform="translate(90 505)"><circle cx="22" cy="36" r="22" fill="#1976d2"/><text x="22" y="42" text-anchor="middle" class="step">2</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#1976d2"/><text x="145" y="22" text-anchor="middle" class="boxTitle">Configure Services</text><text x="145" y="43" text-anchor="middle" class="boxText">Storage, AI Search, DB</text><text x="145" y="60" text-anchor="middle" class="small">Cosmos DB integration</text></g>
    <g transform="translate(90 650)"><circle cx="22" cy="36" r="22" fill="#1976d2"/><text x="22" y="42" text-anchor="middle" class="step">3</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#1976d2"/><text x="145" y="22" text-anchor="middle" class="boxTitle">Sandbox Validate</text><text x="145" y="43" text-anchor="middle" class="boxText">Test agent behavior</text><text x="145" y="60" text-anchor="middle" class="small">dependencies and data flow</text></g>
    <g transform="translate(355 795)"><circle cx="22" cy="36" r="22" fill="#7b1fa2"/><text x="22" y="42" text-anchor="middle" class="step">4</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#7b1fa2"/><text x="145" y="24" text-anchor="middle" class="boxTitle">Manager Approval</text><text x="145" y="45" text-anchor="middle" class="boxText">Review business fit</text><text x="145" y="62" text-anchor="middle" class="small">and publish readiness</text></g>
    <g transform="translate(90 940)"><circle cx="22" cy="36" r="22" fill="#1976d2"/><text x="22" y="42" text-anchor="middle" class="step">5</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#1976d2"/><text x="145" y="24" text-anchor="middle" class="boxTitle">Release Request</text><text x="145" y="45" text-anchor="middle" class="boxText">Submit Marketplace</text><text x="145" y="62" text-anchor="middle" class="small">release form/package</text></g>
    <g transform="translate(620 1085)"><circle cx="22" cy="36" r="22" fill="#ef6c00"/><text x="22" y="42" text-anchor="middle" class="step">6</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#ef6c00"/><text x="145" y="22" text-anchor="middle" class="boxTitle">Team Review</text><text x="145" y="43" text-anchor="middle" class="boxText">Build / Kernel team</text><text x="145" y="60" text-anchor="middle" class="small">connects with owner</text></g>
    <g transform="translate(620 1230)"><circle cx="22" cy="36" r="22" fill="#ef6c00"/><text x="22" y="42" text-anchor="middle" class="step">7</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#ef6c00"/><text x="145" y="22" text-anchor="middle" class="boxTitle">Production Replica</text><text x="145" y="43" text-anchor="middle" class="boxText">Understand requirement</text><text x="145" y="60" text-anchor="middle" class="small">and recreate environment</text></g>
    <g transform="translate(620 1375)"><circle cx="22" cy="36" r="22" fill="#ef6c00"/><text x="22" y="42" text-anchor="middle" class="step">8</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#ef6c00"/><text x="145" y="22" text-anchor="middle" class="boxTitle">Backend Migration</text><text x="145" y="43" text-anchor="middle" class="boxText">Foundry SDK code to</text><text x="145" y="60" text-anchor="middle" class="small">FastAPI microservice</text></g>
    <g transform="translate(885 1375)"><circle cx="22" cy="36" r="22" fill="#00897b"/><text x="22" y="42" text-anchor="middle" class="step">9</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#00897b"/><text x="145" y="22" text-anchor="middle" class="boxTitle">Frontend Build</text><text x="145" y="43" text-anchor="middle" class="boxText">Create UI and connect</text><text x="145" y="60" text-anchor="middle" class="small">backend APIs</text></g>
    <g transform="translate(620 1520)"><circle cx="22" cy="36" r="22" fill="#ef6c00"/><text x="22" y="42" text-anchor="middle" class="step">10</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#ef6c00"/><text x="145" y="22" text-anchor="middle" class="boxTitle">Testing</text><text x="145" y="43" text-anchor="middle" class="boxText">System, integration, UAT</text><text x="145" y="60" text-anchor="middle" class="small">security and regression</text></g>
    <g transform="translate(885 1665)"><circle cx="22" cy="36" r="22" fill="#00897b"/><text x="22" y="42" text-anchor="middle" class="step">11</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#00897b"/><text x="145" y="22" text-anchor="middle" class="boxTitle">DevOps Deploy</text><text x="145" y="43" text-anchor="middle" class="boxText">Containerize and deploy</text><text x="145" y="60" text-anchor="middle" class="small">to Azure Web/App Service</text></g>
    <g transform="translate(1150 1810)"><circle cx="22" cy="36" r="22" fill="#c2185b"/><text x="22" y="42" text-anchor="middle" class="step">12</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#ffffff" stroke="#c2185b"/><text x="145" y="22" text-anchor="middle" class="boxTitle">Final Approval</text><text x="145" y="43" text-anchor="middle" class="boxText">Admin approves release</text><text x="145" y="60" text-anchor="middle" class="small">and changes status</text></g>
    <g transform="translate(1150 1950)"><circle cx="22" cy="36" r="22" fill="#2e7d32"/><text x="22" y="42" text-anchor="middle" class="step">✓</text><rect x="55" y="0" width="180" height="72" rx="12" fill="#e8f5e9" stroke="#2e7d32"/><text x="145" y="24" text-anchor="middle" class="boxTitle">Published</text><text x="145" y="45" text-anchor="middle" class="boxText">Available in Agent Store</text><text x="145" y="62" text-anchor="middle" class="small">for end users</text></g>
  </g>

  <path class="arrow" d="M235 432 L235 505"/><path class="arrow" d="M235 577 L235 650"/><path class="arrow" d="M235 722 C235 775 320 795 410 795"/><path class="arrow" d="M410 867 C410 915 300 940 235 940"/><path class="arrow" d="M235 1012 C235 1060 560 1085 675 1085"/><path class="arrow" d="M675 1157 L675 1230"/><path class="arrow" d="M675 1302 L675 1375"/><path class="arrow" d="M800 1411 L940 1411"/><path class="arrow" d="M940 1447 C940 1510 780 1520 675 1520"/><path class="arrow" d="M675 1592 C675 1640 870 1665 940 1665"/><path class="arrow" d="M1065 1701 C1125 1715 1170 1770 1205 1810"/><path class="arrow" d="M1235 1882 L1235 1950"/>
  <path class="feedback" d="M455 795 C455 735 290 735 235 650"/><text x="455" y="755" class="small" fill="#ef6c00">feedback loop</text>
  <path class="feedback" d="M675 1520 C565 1490 565 1425 675 1411"/><text x="505" y="1470" class="small" fill="#ef6c00">defect fix loop</text>
  <path class="feedback" d="M1205 1810 C1110 1780 1050 1730 1030 1701"/><text x="1090" y="1770" class="small" fill="#ef6c00">release observations</text>

  <g transform="translate(60 2028)">
    <rect width="1280" height="52" rx="12" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="24" y="22" class="boxTitle">Overall Flow:</text>
    <text x="150" y="22" class="boxText">Owner builds and validates the Foundry agent, gets approval, submits marketplace release, Chromosome team productionizes it, DevOps deploys containers, and Admin publishes it.</text>
    <text x="150" y="42" class="small">Outcome: Homologation application becomes available in the Chromosome Marketplace / Agent Store.</text>
  </g>
</svg>