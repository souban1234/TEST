<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill:#0f172a; }
      .subtitle { font: 14px Arial, sans-serif; fill:#475569; }
      .node { fill:#eff6ff; stroke:#2563eb; stroke-width:2.5; }
      .startend { fill:#f1f5f9; stroke:#475569; stroke-width:2.5; }
      .decision { fill:#fff7ed; stroke:#ea580c; stroke-width:2.5; }
      .approved { fill:#f0fdf4; stroke:#16a34a; stroke-width:2.5; }
      .rejected { fill:#fef2f2; stroke:#dc2626; stroke-width:2.5; }
      .senior { fill:#eef2ff; stroke:#4f46e5; stroke-width:2.5; }
      .text { font: 700 17px Arial, sans-serif; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
      .small { font: 13px Arial, sans-serif; fill:#475569; text-anchor:middle; dominant-baseline:middle; }
      .edge { stroke:#334155; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .label { font: 700 13px Arial, sans-serif; fill:#334155; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <rect width="1200" height="1180" fill="#ffffff"/>
  <text x="600" y="45" class="title" text-anchor="middle">Employee Leave Approval Process</text>
  <text x="600" y="72" class="subtitle" text-anchor="middle">Includes manager review and senior manager approval before final confirmation</text>

  <rect x="470" y="105" width="260" height="58" rx="29" class="startend"/>
  <text x="600" y="134" class="text">Start</text>

  <rect x="440" y="205" width="320" height="72" rx="14" class="node"/>
  <text x="600" y="232" class="text">Employee submits</text>
  <text x="600" y="255" class="small">leave request</text>

  <rect x="440" y="320" width="320" height="72" rx="14" class="node"/>
  <text x="600" y="347" class="text">HR / Leave system</text>
  <text x="600" y="370" class="small">records request</text>

  <rect x="440" y="435" width="320" height="72" rx="14" class="node"/>
  <text x="600" y="462" class="text">Manager reviews</text>
  <text x="600" y="485" class="small">request details</text>

  <path d="M600 545 L775 625 L600 705 L425 625 Z" class="decision"/>
  <text x="600" y="615" class="text">Leave balance</text>
  <text x="600" y="640" class="small">available?</text>

  <path d="M600 735 L775 815 L600 895 L425 815 Z" class="decision"/>
  <text x="600" y="805" class="text">Work coverage</text>
  <text x="600" y="830" class="small">acceptable?</text>

  <rect x="820" y="780" width="270" height="70" rx="14" class="approved"/>
  <text x="955" y="807" class="text">Manager approves</text>
  <text x="955" y="830" class="small">forward for senior approval</text>

  <path d="M955 885 L1115 955 L955 1025 L795 955 Z" class="decision"/>
  <text x="955" y="945" class="text">Senior manager</text>
  <text x="955" y="970" class="small">approves?</text>

  <rect x="515" y="1020" width="260" height="70" rx="14" class="approved"/>
  <text x="645" y="1047" class="text">Update records</text>
  <text x="645" y="1070" class="small">calendar and leave balance</text>

  <rect x="95" y="590" width="260" height="70" rx="14" class="rejected"/>
  <text x="225" y="617" class="text">Reject request</text>
  <text x="225" y="640" class="small">manager rejection</text>

  <rect x="95" y="710" width="260" height="70" rx="14" class="rejected"/>
  <text x="225" y="737" class="text">Record reason</text>
  <text x="225" y="760" class="small">for rejection</text>

  <rect x="440" y="930" width="320" height="72" rx="14" class="node"/>
  <text x="600" y="957" class="text">Notify employee</text>
  <text x="600" y="980" class="small">approval or rejection outcome</text>

  <rect x="470" y="1115" width="260" height="58" rx="29" class="startend"/>
  <text x="600" y="1144" class="text">End</text>

  <path d="M600 163 L600 200" class="edge"/>
  <path d="M600 277 L600 315" class="edge"/>
  <path d="M600 392 L600 430" class="edge"/>
  <path d="M600 507 L600 540" class="edge"/>
  <path d="M600 705 L600 730" class="edge"/>
  <text x="635" y="718" class="label">Yes</text>

  <path d="M425 625 L360 625" class="edge"/>
  <text x="390" y="605" class="label">No</text>

  <path d="M775 815 L815 815" class="edge"/>
  <text x="795" y="795" class="label">Yes</text>

  <path d="M425 815 C365 815 325 785 295 780" class="edge"/>
  <text x="385" y="795" class="label">No</text>

  <path d="M955 850 L955 880" class="edge"/>
  <path d="M795 955 L765 955" class="edge"/>
  <text x="780" y="935" class="label">No</text>
  <path d="M955 1025 C920 1090 790 1085 780 1060" class="edge"/>
  <text x="890" y="1070" class="label">Yes</text>

  <path d="M645 1020 C645 1005 625 1005 615 1002" class="edge"/>
  <path d="M225 660 L225 705" class="edge"/>
  <path d="M225 780 C225 905 410 945 435 960" class="edge"/>
  <path d="M440 966 C395 930 365 880 355 780" class="edge"/>
  <path d="M600 1002 L600 1110" class="edge"/>

  <rect x="805" y="110" width="330" height="165" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="970" y="138" class="text">Legend</text>
  <rect x="830" y="158" width="32" height="22" rx="5" class="node"/>
  <text x="980" y="169" class="small">Process step</text>
  <path d="M846 188 L877 202 L846 216 L815 202 Z" class="decision"/>
  <text x="980" y="202" class="small">Decision</text>
  <rect x="830" y="220" width="32" height="22" rx="5" class="approved"/>
  <text x="980" y="231" class="small">Approval path</text>
  <rect x="830" y="248" width="32" height="22" rx="5" class="senior"/>
  <text x="980" y="259" class="small">Senior manager review</text>
</svg>